services:
  - type: web
    name: key-transposer-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_DURATION_SECONDS
        value: "1200"
